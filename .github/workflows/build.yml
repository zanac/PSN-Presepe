name: Arduino Mega Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Install libraries
        run: |
          arduino-cli lib install "Adafruit NeoPixel"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit GFX Library"

      - name: Compile for Arduino Mega 2560
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn arduino:avr:mega \
            --output-dir build \
            firmware/PSN-Presepe

      - name: Build Windows portable flash package
        run: |
          mkdir -p portable
          cp build/PSN-Presepe.ino.hex portable/
          cp firmware/PSN-Presepe/flash-windows.bat portable/
          curl -fsSL https://downloads.arduino.cc/arduino-cli/arduino-cli_latest_Windows_64bit.zip -o /tmp/arduino-cli-win.zip
          unzip -j /tmp/arduino-cli-win.zip arduino-cli.exe -d portable/

      - name: Upload compiled firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSN-Presepe-Arduino-Mega
          path: build/

      - name: Upload Windows portable flasher
        uses: actions/upload-artifact@v4
        with:
          name: PSN-Presepe-Windows-Portable
          path: portable/
