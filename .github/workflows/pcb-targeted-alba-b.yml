name: PCB Relay Contact Batch
'on':
  push:
    branches: [dev]
    paths:
      - ".github/workflows/pcb-targeted-alba-b.yml"
      - "hardware/pcb/tools/grid_router.py"
permissions:
  contents: read
jobs:
  route:
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:9.0
      options: --user 0
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify KiCad CLI
        run: kicad-cli version
      - name: Build obstacle-aware relay candidates
        run: |
          set -eu
          mkdir -p hardware/pcb/targeted-relays
          python3 - <<'PY'
          from pathlib import Path
          import math,re,subprocess,tempfile
          base=Path("hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb").read_text()
          def blocks(text,token):
            p=0
            while True:
              st=text.find(token,p)
              if st<0:return
              d=0;q=False;esc=False
              for i in range(st,len(text)):
                ch=text[i]
                if q:
                  if esc:esc=False
                  elif ch=="\\":esc=True
                  elif ch=='"':q=False
                else:
                  if ch=='"':q=True
                  elif ch=="(":d+=1
                  elif ch==")":
                    d-=1
                    if d==0: yield text[st:i+1];p=i+1;break
          pads={}
          for fp in blocks(base,"(footprint"):
            rm=re.search(r'\(property "Reference" "([^"]+)"',fp); am=re.search(r'\(at ([-\d.]+) ([-\d.]+)(?: ([-\d.]+))?\)',fp)
            if not(rm and am):continue
            ref=rm.group(1)
            if not(re.fullmatch(r'K\d+',ref) or re.fullmatch(r'JR\d+',ref)):continue
            fx,fy,rot=float(am.group(1)),float(am.group(2)),float(am.group(3) or 0); aa=math.radians(rot)
            for pb in blocks(fp,"(pad"):
              nm=re.search(r'\(net (\d+) "(R\d+_(?:COM|NO|NC))"\)',pb); pm=re.search(r'\(at ([-\d.]+) ([-\d.]+)',pb)
              if not(nm and pm):continue
              px,py=float(pm.group(1)),float(pm.group(2)); x=fx+px*math.cos(aa)-py*math.sin(aa); y=fy+px*math.sin(aa)+py*math.cos(aa)
              pads.setdefault(nm.group(2),[]).append((x,y,int(nm.group(1)),ref))
          byrelay={}
          for net,ps in pads.items():
            if len(ps)==2: byrelay.setdefault(int(net[1:net.index('_')]),[]).append((net,ps))
          for rn,nets in sorted(byrelay.items()):
            work=base; solved=[]
            # Route contacts one at a time; each accepted route becomes an obstacle.
            for net,ps in sorted(nets,key=lambda z:{"COM":0,"NO":1,"NC":2}[z[0].split("_")[1]]):
              a,b=ps
              if math.hypot(a[0]-b[0],a[1]-b[1])>70: continue
              tmp=Path(f"/tmp/R{rn}-{net}.kicad_pcb"); tmp.write_text(work)
              cmd=["python3","hardware/pcb/tools/grid_router.py",str(tmp),"--net",net,
                   "--start",f"{a[0]},{a[1]},F.Cu","--goal",f"{b[0]},{b[1]},F.Cu",
                   "--step","0.5","--clearance","0.55","--margin","45"]
              p=subprocess.run(cmd,text=True,capture_output=True)
              if p.returncode: print("NO_ROUTE",rn,net,"RC",p.returncode,"ERR",p.stderr.strip(),"OUT",p.stdout.strip()); continue
              pts=[]
              for line in p.stdout.splitlines()[1:]:
                x,y,la=line.split(","); pts.append((float(x),float(y),la))
              # Grid endpoints are rounded; force exact pad centers so the route
              # electrically terminates on the intended relay/terminal pads.
              if pts:
                pts[0]=(a[0],a[1],pts[0][2]); pts[-1]=(b[0],b[1],pts[-1][2])
              items=[]
              for u,v in zip(pts,pts[1:]):
                if u[2]!=v[2]:
                  items.append(f'\t(via (at {u[0]} {u[1]}) (size 1.2) (drill 0.6) (layers "F.Cu" "B.Cu") (net {a[2]}))\n')
                  continue
                else: items.append(f'\t(segment (start {u[0]} {u[1]}) (end {v[0]} {v[1]}) (width 0.8) (layer "{u[2]}") (net {a[2]}))\n')
              idx=work.rfind(")"); work=work[:idx]+''.join(items)+work[idx:]
              # KiCad connectivity needs copper on both sides of every via.
              # A layer-flip point is represented by a via plus the following
              # segment; ensure there is also a short approach on the new layer.
              solved.append(net)
            if solved:
              Path(f"hardware/pcb/targeted-relays/R{rn}.kicad_pcb").write_text(work)
              print("ASTAR_RELAY",rn,len(solved),solved)
          PY
      - name: DRC all candidates
        run: |
          set -u
          for pcb in hardware/pcb/targeted-relays/*.kicad_pcb; do
            echo "DRC $pcb"
            n="${pcb%.kicad_pcb}"
            kicad-cli pcb drc --severity-all --output "${n}.drc.txt" "$pcb" || true
            echo "REPORT ${n}.drc.txt"; grep -E "^Found|^\\[" "${n}.drc.txt" | head -80 || true
          done
      - name: Rank candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in sorted(Path("hardware/pcb/targeted-relays").glob("*.drc.txt")):
              t=p.read_text()
              m=re.search(r'Found +([0-9]+) +unconnected +(items|pads)',t,re.I)
              u=int(m.group(1)) if m else t.count('[unconnected_items]')
              cats=[x[1:x.index(']')] for x in t.splitlines() if x.startswith('[') and ']' in x]
              critical=sorted({x for x in cats if x not in {'unconnected_items','lib_footprint_mismatch'}})
              print(p.name,"unconnected=",u,"critical=",critical or "none")
              if critical:
                  lines=t.splitlines()
                  for i,line in enumerate(lines):
                      if line.startswith('[') and line[1:line.index(']')] in critical:
                          print("DETAIL",p.name,*lines[i:i+5],sep=" | ")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: targeted-relay-contact-candidate
          path: hardware/pcb/targeted-relays/










