name: PCB Targeted ALBA_B Route
'on':
  push:
    branches: [dev]
    paths:
      - ".github/workflows/pcb-targeted-alba-b.yml"
      - "hardware/pcb/tools/grid_router.py"
permissions:
  contents: read
jobs:
  route:
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:9.0
      options: --user 0
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify KiCad CLI
        run: kicad-cli version
      - name: Build obstacle-aware ALBA candidate
        run: |
          set -eu
          mkdir -p hardware/pcb/targeted-alba
          PCB=hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb
          python3 hardware/pcb/tools/grid_router.py "$PCB" --net ALBA_B_NEG \
            --start 112.54,165,B.Cu --goal 171.24,184,B.Cu --step 0.5 --clearance 0.35 --margin 25 \
            > hardware/pcb/targeted-alba/astar.route
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path("hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb").read_text()
          pts=[]
          for line in Path("hardware/pcb/targeted-alba/astar.route").read_text().splitlines()[1:]:
              x,y,la=line.split(","); pts.append((float(x),float(y),la))
          # net 61 = ALBA_B_NEG on the current Rev-A board.
          items=[]
          for a,b in zip(pts,pts[1:]):
              if a[2]!=b[2]:
                  items.append(f'\t(via (at {a[0]} {a[1]}) (size 0.8) (drill 0.4) (layers "F.Cu" "B.Cu") (net 61))\n')
              else:
                  items.append(f'\t(segment (start {a[0]} {a[1]}) (end {b[0]} {b[1]}) (width 0.4) (layer "{a[2]}") (net 61))\n')
          idx=src.rfind(")")
          out=src[:idx]+''.join(items)+src[idx:]
          Path("hardware/pcb/targeted-alba/astar.kicad_pcb").write_text(out)
          print("route points",len(pts),"items",len(items))
          PY
      - name: DRC all candidates
        run: |
          set -u
          for pcb in hardware/pcb/targeted-alba/*.kicad_pcb; do
            n="${pcb%.kicad_pcb}"
            kicad-cli pcb drc --severity-error --output "${n}.drc.txt" "$pcb" || true
          done
      - name: Rank candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in sorted(Path("hardware/pcb/targeted-alba").glob("*.drc.txt")):
              t=p.read_text()
              m=re.search(r'Found +([0-9]+) +unconnected +(items|pads)',t,re.I)
              u=int(m.group(1)) if m else t.count('[unconnected_items]')
              cats=[x[1:x.index(']')] for x in t.splitlines() if x.startswith('[') and ']' in x]
              critical=sorted({x for x in cats if x not in {'unconnected_items','lib_footprint_mismatch'}})
              print(p.name,"unconnected=",u,"critical=",critical or "none")
              if critical:
                  lines=t.splitlines()
                  for i,line in enumerate(lines):
                      if line.startswith('[') and line[1:line.index(']')] in critical:
                          print("DETAIL",p.name,*lines[i:i+5],sep=" | ")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: targeted-alba-b-candidates
          path: hardware/pcb/targeted-alba/





