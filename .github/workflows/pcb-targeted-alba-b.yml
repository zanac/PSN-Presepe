name: PCB Relay Contact Batch
'on':
  push:
    branches: [dev]
    paths:
      - ".github/workflows/pcb-targeted-alba-b.yml"
      - "hardware/pcb/tools/grid_router.py"
permissions:
  contents: read
jobs:
  route:
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:9.0
      options: --user 0
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify KiCad CLI
        run: kicad-cli version
      - name: Build relay-contact batch candidate
        run: |
          set -eu
          mkdir -p hardware/pcb/targeted-relays
          python3 - <<'PY'
          from pathlib import Path
          import math,re
          src=Path("hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb").read_text()
          def blocks(text,token):
            p=0
            while True:
              st=text.find(token,p)
              if st<0:return
              d=0;q=False;esc=False
              for i in range(st,len(text)):
                ch=text[i]
                if q:
                  if esc:esc=False
                  elif ch=="\\":esc=True
                  elif ch=='"':q=False
                else:
                  if ch=='"':q=True
                  elif ch=="(":d+=1
                  elif ch==")":
                    d-=1
                    if d==0:
                      yield text[st:i+1];p=i+1;break
          pads={}
          for b in blocks(src,"(footprint "):
            rm=re.search(r'\(property "Reference" "([^"]+)"',b); am=re.search(r'\(at ([-\d.]+) ([-\d.]+)(?: ([-\d.]+))?\)',b)
            if not(rm and am):continue
            ref=rm.group(1)
            if not (re.fullmatch(r'K\d+',ref) or re.fullmatch(r'JR\d+',ref)):continue
            fx,fy,rot=float(am.group(1)),float(am.group(2)),float(am.group(3) or 0); a=math.radians(rot)
            for pb in blocks(b,"(pad "):
              nm=re.search(r'\(net (\d+) "(R\d+_(?:COM|NO|NC))"\)',pb); pm=re.search(r'\(at ([-\d.]+) ([-\d.]+)',pb)
              if not(nm and pm):continue
              px,py=float(pm.group(1)),float(pm.group(2))
              x=fx+px*math.cos(a)+py*math.sin(a); y=fy-px*math.sin(a)+py*math.cos(a)
              pads.setdefault(nm.group(2),[]).append((x,y,int(nm.group(1)),ref))
          items=[]; routed=[]
          for net,ps in sorted(pads.items(),key=lambda z:int(re.search(r'\d+',z[0]).group())):
            if len(ps)!=2:continue
            a,b=ps
            # Only short/medium relay-contact pairs in first safe batch; use B.Cu,
            # 1.0 mm copper and orthogonal dogleg. DRC decides acceptance.
            if math.hypot(a[0]-b[0],a[1]-b[1])>55:continue
            xmid=(a[0]+b[0])/2
            pts=[(a[0],a[1]),(xmid,a[1]),(xmid,b[1]),(b[0],b[1])]
            for p,q in zip(pts,pts[1:]):
              if p!=q: items.append(f'\t(segment (start {p[0]:.3f} {p[1]:.3f}) (end {q[0]:.3f} {q[1]:.3f}) (width 1.0) (layer "B.Cu") (net {a[2]}))\n')
            routed.append(net)
          idx=src.rfind(")")
          Path("hardware/pcb/targeted-relays/batch.kicad_pcb").write_text(src[:idx]+''.join(items)+src[idx:])
          print("relay nets proposed",len(routed),routed)
          PY
      - name: DRC all candidates
        run: |
          set -u
          for pcb in hardware/pcb/targeted-relays/*.kicad_pcb; do
            n="${pcb%.kicad_pcb}"
            kicad-cli pcb drc --severity-error --output "${n}.drc.txt" "$pcb" || true
          done
      - name: Rank candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in sorted(Path("hardware/pcb/targeted-relays").glob("*.drc.txt")):
              t=p.read_text()
              m=re.search(r'Found +([0-9]+) +unconnected +(items|pads)',t,re.I)
              u=int(m.group(1)) if m else t.count('[unconnected_items]')
              cats=[x[1:x.index(']')] for x in t.splitlines() if x.startswith('[') and ']' in x]
              critical=sorted({x for x in cats if x not in {'unconnected_items','lib_footprint_mismatch'}})
              print(p.name,"unconnected=",u,"critical=",critical or "none")
              if critical:
                  lines=t.splitlines()
                  for i,line in enumerate(lines):
                      if line.startswith('[') and line[1:line.index(']')] in critical:
                          print("DETAIL",p.name,*lines[i:i+5],sep=" | ")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: targeted-relay-contact-candidate
          path: hardware/pcb/targeted-relays/










