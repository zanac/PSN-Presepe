name: PCB Relay Contact Batch
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/pcb-targeted-alba-b.yml"
      - "hardware/pcb/tools/grid_router.py"
permissions:
  contents: write
jobs:
  route:
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:9.0
      options: --user 0
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify KiCad CLI and router syntax
        run: |
          kicad-cli version
          python3 -m py_compile hardware/pcb/tools/grid_router.py
      - name: Build obstacle-aware relay candidates
        run: |
          set -eu
          mkdir -p hardware/pcb/targeted-relays
          python3 - <<'PY'
          from pathlib import Path
          import math,re,subprocess,tempfile
          base=Path("hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb").read_text()
          def blocks(text,token):
            p=0
            while True:
              st=text.find(token,p)
              if st<0:return
              d=0;q=False;esc=False
              for i in range(st,len(text)):
                ch=text[i]
                if q:
                  if esc:esc=False
                  elif ch=="\\":esc=True
                  elif ch=='"':q=False
                else:
                  if ch=='"':q=True
                  elif ch=="(":d+=1
                  elif ch==")":
                    d-=1
                    if d==0: yield text[st:i+1];p=i+1;break
          pads={}
          for fp in blocks(base,"(footprint"):
            rm=re.search(r'\(property "Reference" "([^"]+)"',fp); am=re.search(r'\(at ([-\d.]+) ([-\d.]+)(?: ([-\d.]+))?\)',fp)
            if not(rm and am):continue
            ref=rm.group(1)
            if not(re.fullmatch(r'K\d+',ref) or re.fullmatch(r'JR\d+',ref)):continue
            fx,fy,rot=float(am.group(1)),float(am.group(2)),float(am.group(3) or 0); aa=math.radians(-rot)
            for pb in blocks(fp,"(pad"):
              nm=re.search(r'\(net (\d+) "(R\d+_(?:COM|NO|NC))"\)',pb); pm=re.search(r'\(at ([-\d.]+) ([-\d.]+)',pb)
              if not(nm and pm):continue
              px,py=float(pm.group(1)),float(pm.group(2)); x=fx+px*math.cos(aa)-py*math.sin(aa); y=fy+px*math.sin(aa)+py*math.cos(aa)
              pads.setdefault(nm.group(2),[]).append((x,y,int(nm.group(1)),ref))
          byrelay={}
          for net,ps in pads.items():
            if len(ps)==2: byrelay.setdefault(int(net[1:net.index('_')]),[]).append((net,ps))
          targets={"R11_NC","R14_COM","R15_NC","R16_COM","R16_NO","R16_NC"}
          print("RELAY_MAP",len(byrelay),sorted((k,len(v)) for k,v in byrelay.items()))
          work=base; solved=[]
          order=[]
          for rn,nets in sorted(byrelay.items()):
            for net,ps in sorted(nets):
              if net in targets: order.append((rn,net,ps))
          for rn,net,ps in order:
            a,b=ps
            tmp=Path(f"/tmp/cumulative-{net}.kicad_pcb"); tmp.write_text(work)
            p=None
            for step,margin,to,via,clear in [("0.25","70",12,"180","1.75"),("0.25","90",15,"220","1.25"),("0.25","110",18,"260","1.00"),("0.125","14",18,"300","1.00")]:
              cmd=["python3","hardware/pcb/tools/grid_router.py",str(tmp),"--net",net,
                   "--start",f"{a[0]},{a[1]},B.Cu","--goal",f"{b[0]},{b[1]},B.Cu",
                   "--step",step,"--clearance",clear,"--margin",margin,"--via-cost",via]
              try:
                q=subprocess.run(cmd,text=True,capture_output=True,timeout=to)
              except subprocess.TimeoutExpired:
                print("TIMEOUT",net,"step",step,"clear",clear); continue
              if q.returncode==0:
                p=q; print("ROUTED_GRID",net,step,"clear",clear); break
              print("NO_ROUTE_GRID",net,step,"clear",clear,q.stderr.strip())
            if p is None: continue
            pts=[]
            for line in p.stdout.splitlines()[1:]:
              x,y,la=line.split(","); pts.append((float(x),float(y),la))
            if not pts: continue
            pts.insert(0,(a[0],a[1],pts[0][2])); pts.append((b[0],b[1],pts[-1][2]))
            items=[]
            for u,v in zip(pts,pts[1:]):
              if u[2]!=v[2]:
                if math.hypot(u[0]-a[0],u[1]-a[1])<1.0 or math.hypot(u[0]-b[0],u[1]-b[1])<1.0: continue
                items.append(f'\\t(via (at {u[0]} {u[1]}) (size 1.5) (drill 0.8) (layers "F.Cu" "B.Cu") (net {a[2]}))\\n')
              else:
                items.append(f'\\t(segment (start {u[0]} {u[1]}) (end {v[0]} {v[1]}) (width 1.0) (layer "{u[2]}") (net {a[2]}))\\n')
            idx=work.rfind(")"); work=work[:idx]+''.join(items).encode().decode('unicode_escape')+work[idx:]
            solved.append(net); print("CUMULATIVE",len(solved),net,len(pts))
          Path("hardware/pcb/targeted-relays/cumulative.kicad_pcb").write_text(work)
          print("CUMULATIVE_DONE",len(solved),solved)
          PY
      - name: Build selective clearance-cleanup candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb")
          t=p.read_text()
          bad={"R9_NC","R14_COM","R3_NO","R3_COM","R10_COM","R10_NO","R4_NO","R4_COM","R5_NO","R5_COM","R1_COM","R1_NO","R6_COM","R6_NO","R2_COM","R2_NO","R8_NC","R8_COM"}
          ids={int(n) for n,name in re.findall(r'\(net (\d+) "([^"]+)"\)',t) if name in bad}
          def strip_blocks(text,token):
            out=[]; pos=0
            while True:
              st=text.find(token,pos)
              if st<0: out.append(text[pos:]); break
              out.append(text[pos:st]); d=0; q=False; esc=False; end=None
              for i in range(st,len(text)):
                ch=text[i]
                if q:
                  if esc: esc=False
                  elif ch=="\\\\": esc=True
                  elif ch=='"': q=False
                else:
                  if ch=='"': q=True
                  elif ch=="(": d+=1
                  elif ch==")":
                    d-=1
                    if d==0: end=i+1; break
              b=text[st:end]
              m=re.search(r'[(]net ([0-9]+)[)]',b)
              if not(m and int(m.group(1)) in ids): out.append(b)
              pos=end
            return ''.join(out)
          t=strip_blocks(t,"(segment")
          t=strip_blocks(t,"(via")
          out=Path("hardware/pcb/targeted-relays/cleanup.kicad_pcb"); out.parent.mkdir(parents=True,exist_ok=True); out.write_text(t)
          print("CLEANUP_NETS",len(ids),sorted(bad))
          PY
      - name: DRC all candidates
        run: |
          set -u
          for pcb in hardware/pcb/targeted-relays/*.kicad_pcb; do
            echo "DRC $pcb"
            n="${pcb%.kicad_pcb}"
            rm -rf /tmp/kicadctx && mkdir -p /tmp/kicadctx
            cp -a hardware/pcb/kicad/. /tmp/kicadctx/
            cp "$pcb" /tmp/kicadctx/PSN-Presepe-Mega.kicad_pcb
            (cd /tmp/kicadctx && kicad-cli pcb drc --severity-all --output /tmp/candidate.drc.txt PSN-Presepe-Mega.kicad_pcb) || true
            cp /tmp/candidate.drc.txt "${n}.drc.txt"
            echo "REPORT ${n}.drc.txt"; grep -E "^Found|^\\[" "${n}.drc.txt" | head -80 || true
          done
      - name: Rank candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in sorted(Path("hardware/pcb/targeted-relays").glob("*.drc.txt")):
              t=p.read_text()
              m=re.search(r'Found +([0-9]+) +unconnected +(items|pads)',t,re.I)
              u=int(m.group(1)) if m else t.count('[unconnected_items]')
              cats=[x[1:x.index(']')] for x in t.splitlines() if x.startswith('[') and ']' in x]
              # hole_to_hole and the single via_dangling are established baseline
              # categories on the official board; reject only newly introduced electrical/geometry classes here.
              critical=sorted({x for x in cats if x not in {'unconnected_items','lib_footprint_mismatch','hole_to_hole','via_dangling'}})
              print(p.name,"unconnected=",u,"critical=",critical or "none")
              if critical:
                  lines=t.splitlines()
                  for i,line in enumerate(lines):
                      if line.startswith('[') and line[1:line.index(']')] in critical:
                          print("DETAIL",p.name,*lines[i:i+5],sep=" | ")
          PY
      - name: Promote cumulative candidate when electrically clean
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,shutil
          drc=Path("hardware/pcb/targeted-relays/cumulative.drc.txt").read_text()
          forbidden={"clearance","shorting_items","tracks_crossing","hole_clearance","solder_mask_bridge","track_dangling"}
          cats={line[1:line.index("]")] for line in drc.splitlines() if line.startswith("[") and "]" in line}
          m=re.search(r'Found +([0-9]+) +unconnected +(?:items|pads)',drc,re.I)
          unc=int(m.group(1)) if m else 999
          bad=sorted(cats & forbidden)
          if bad or unc>=75:
            print(f"NOT_PROMOTABLE unconnected={unc} bad={bad}")
            raise SystemExit(0)
          shutil.copy2("hardware/pcb/targeted-relays/cumulative.kicad_pcb","hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb")
          Path("hardware/pcb/worklog/CURRENT.md").write_text(Path("hardware/pcb/worklog/CURRENT.md").read_text()+f"\\n- Relay cumulative A* candidate promoted by CI validation: {unc} unconnected; no new electrical/geometry DRC classes.\\n")
          print("PROMOTED",unc)
          PY
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb hardware/pcb/worklog/CURRENT.md
          if git diff --cached --quiet; then echo "No promotable board change"; else git commit -m "Promote cumulative relay routing candidate"; git push; fi
      - uses: actions/upload-artifact@v4
        with:
          name: targeted-relay-contact-candidate
          path: hardware/pcb/targeted-relays/










