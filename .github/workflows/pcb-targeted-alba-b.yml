name: PCB Targeted ALBA_B Route
'on':
  push:
    branches: [dev]
    paths: [".github/workflows/pcb-targeted-alba-b.yml"]
permissions:
  contents: read
jobs:
  route:
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:9.0
      options: --user 0
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify KiCad CLI
        run: kicad-cli version
      - name: Build targeted candidates
        run: |
          mkdir -p hardware/pcb/targeted-alba
          python3 - <<'PY'
          from pathlib import Path
          src=Path("hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb").read_text()
          net=61
          # Do not reject the net merely because pads/metadata reference net 61.
          # Existing copper is left untouched; candidate DRC decides whether the added route is valid.
          # ALBA_B_NEG: Q9.2 (112.54,165) -> J_ALBA.4 (171.24,184).
          # Conservative H/V/45 candidates, 0.30mm signal trace, 0 or 2 vias.
          variants={
            # Key observation from DRC: the direct Q9 escape crosses long F/B signal trunks.
            # Go upward first on B.Cu, switch layer above those trunks, traverse right,
            # then descend close to the destination and finish on the PTH pad.
            "upper_150":[('s',112.54,165,112.54,150,'B.Cu'),('v',112.54,150),('s',112.54,150,174,150,'F.Cu'),('s',174,150,174,181.24,'F.Cu'),('s',174,181.24,171.24,184,'F.Cu'),('v',171.24,184)],
            "upper_155":[('s',112.54,165,112.54,155,'B.Cu'),('v',112.54,155),('s',112.54,155,175,155,'F.Cu'),('s',175,155,175,180.24,'F.Cu'),('s',175,180.24,171.24,184,'F.Cu'),('v',171.24,184)],
            "upper_145":[('s',112.54,165,112.54,145,'B.Cu'),('v',112.54,145),('s',112.54,145,176,145,'F.Cu'),('s',176,145,176,179.24,'F.Cu'),('s',176,179.24,171.24,184,'F.Cu'),('v',171.24,184)],
            "far_right_b":[('s',112.54,165,112.54,150,'B.Cu'),('s',112.54,150,178,150,'B.Cu'),('s',178,150,178,177.24,'B.Cu'),('s',178,177.24,171.24,184,'B.Cu')],
            "upper_mix":[('s',112.54,165,112.54,152,'B.Cu'),('v',112.54,152),('s',112.54,152,178,152,'F.Cu'),('s',178,152,178,176,'F.Cu'),('v',178,176),('s',178,176,171.24,182.76,'B.Cu'),('s',171.24,182.76,171.24,184,'B.Cu')],
          }
          # Insert before the board's final closing parenthesis; KiCad 9 accepts these top-level primitives.
          edge=src.rfind(")")
          assert edge>0
          for name,items in variants.items():
              out=[]
              for x in items:
                  if x[0]=='s':
                      _,x1,y1,x2,y2,layer=x
                      out.append(f'  (segment (start {x1} {y1}) (end {x2} {y2}) (width 0.3) (layer "{layer}") (net {net}))')
                  else:
                      _,x1,y1=x
                      out.append(f'  (via (at {x1} {y1}) (size 0.8) (drill 0.4) (layers "F.Cu" "B.Cu") (net {net}))')
              Path(f"hardware/pcb/targeted-alba/{name}.kicad_pcb").write_text(src[:edge]+"\n".join(out)+"\n"+src[edge:])
          PY
      - name: DRC all candidates
        run: |
          set -u
          for pcb in hardware/pcb/targeted-alba/*.kicad_pcb; do
            n="${pcb%.kicad_pcb}"
            kicad-cli pcb drc --severity-error --output "${n}.drc.txt" "$pcb" || true
          done
      - name: Rank candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in sorted(Path("hardware/pcb/targeted-alba").glob("*.drc.txt")):
              t=p.read_text()
              m=re.search(r'Found +([0-9]+) +unconnected +(items|pads)',t,re.I)
              u=int(m.group(1)) if m else t.count('[unconnected_items]')
              cats=[x[1:x.index(']')] for x in t.splitlines() if x.startswith('[') and ']' in x]
              critical=sorted({x for x in cats if x not in {'unconnected_items','lib_footprint_mismatch'}})
              print(p.name,"unconnected=",u,"critical=",critical or "none")
              if critical:
                  lines=t.splitlines()
                  for i,line in enumerate(lines):
                      if line.startswith('[') and line[1:line.index(']')] in critical:
                          print("DETAIL",p.name,*lines[i:i+5],sep=" | ")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: targeted-alba-b-candidates
          path: hardware/pcb/targeted-alba/
