name: PCB Targeted ALBA_B Route
on:
  push:
    branches: [dev]
    paths: [".github/workflows/pcb-targeted-alba-b.yml"]
permissions:
  contents: read
jobs:
  route:
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:9.0
      options: --user 0
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify KiCad CLI
        run: kicad-cli version
      - name: Build targeted candidates
        run: |
          mkdir -p hardware/pcb/targeted-alba
          python3 - <<'PY'
          from pathlib import Path
          src=Path("hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb").read_text()
          net=61
          # Do not reject the net merely because pads/metadata reference net 61.
          # Existing copper is left untouched; candidate DRC decides whether the added route is valid.
          # ALBA_B_NEG: Q9.2 (112.54,165) -> J_ALBA.4 (171.24,184).
          # Conservative H/V/45 candidates, 0.30mm signal trace, 0 or 2 vias.
          variants={
            # Escape immediately away from the dense B.Cu bundle, then use a low corridor.
            "esc_f_left_183":[
              ('v',112.54,165),('s',112.54,165,108.54,169,'F.Cu'),('s',108.54,169,108.54,183,'F.Cu'),('s',108.54,183,170.24,183,'F.Cu'),('s',170.24,183,171.24,184,'F.Cu'),('v',171.24,184)],
            "esc_f_right_183":[
              ('v',112.54,165),('s',112.54,165,116.54,169,'F.Cu'),('s',116.54,169,116.54,183,'F.Cu'),('s',116.54,183,170.24,183,'F.Cu'),('s',170.24,183,171.24,184,'F.Cu'),('v',171.24,184)],
            "esc_b_left_183":[
              ('s',112.54,165,108.54,165,'B.Cu'),('s',108.54,165,106.54,167,'B.Cu'),('s',106.54,167,106.54,183,'B.Cu'),('s',106.54,183,170.24,183,'B.Cu'),('s',170.24,183,171.24,184,'B.Cu')],
            "esc_b_right_183":[
              ('s',112.54,165,116.54,165,'B.Cu'),('s',116.54,165,118.54,167,'B.Cu'),('s',118.54,167,118.54,183,'B.Cu'),('s',118.54,183,170.24,183,'B.Cu'),('s',170.24,183,171.24,184,'B.Cu')],
            "esc_mix_left":[
              ('v',112.54,165),('s',112.54,165,108.54,169,'F.Cu'),('s',108.54,169,108.54,181.5,'F.Cu'),('v',108.54,181.5),('s',108.54,181.5,168.74,181.5,'B.Cu'),('s',168.74,181.5,171.24,184,'B.Cu')],
            "esc_mix_right":[
              ('v',112.54,165),('s',112.54,165,116.54,169,'F.Cu'),('s',116.54,169,116.54,181.5,'F.Cu'),('v',116.54,181.5),('s',116.54,181.5,168.74,181.5,'B.Cu'),('s',168.74,181.5,171.24,184,'B.Cu')],
          }
          # Insert before the board's final closing parenthesis; KiCad 9 accepts these top-level primitives.
          edge=src.rfind(")")
          assert edge>0
          for name,items in variants.items():
              out=[]
              for x in items:
                  if x[0]=='s':
                      _,x1,y1,x2,y2,layer=x
                      out.append(f'  (segment (start {x1} {y1}) (end {x2} {y2}) (width 0.3) (layer "{layer}") (net {net}))')
                  else:
                      _,x1,y1=x
                      out.append(f'  (via (at {x1} {y1}) (size 0.8) (drill 0.4) (layers "F.Cu" "B.Cu") (net {net}))')
              Path(f"hardware/pcb/targeted-alba/{name}.kicad_pcb").write_text(src[:edge]+"\n".join(out)+"\n"+src[edge:])
          PY
      - name: DRC all candidates
        run: |
          set -u
          for pcb in hardware/pcb/targeted-alba/*.kicad_pcb; do
            n="${pcb%.kicad_pcb}"
            kicad-cli pcb drc --severity-error --output "${n}.drc.txt" "$pcb" || true
          done
      - name: Rank candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in sorted(Path("hardware/pcb/targeted-alba").glob("*.drc.txt")):
              t=p.read_text()
              m=re.search(r'Found +([0-9]+) +unconnected +(items|pads)',t,re.I)
              u=int(m.group(1)) if m else t.count('[unconnected_items]')
              cats=[x[1:x.index(']')] for x in t.splitlines() if x.startswith('[') and ']' in x]
              critical=sorted({x for x in cats if x not in {'unconnected_items','lib_footprint_mismatch'}})
              print(p.name,"unconnected=",u,"critical=",critical or "none")
              if critical:
                  lines=t.splitlines()
                  for i,line in enumerate(lines):
                      if line.startswith('[') and line[1:line.index(']')] in critical:
                          print("DETAIL",p.name,*lines[i:i+5],sep=" | ")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: targeted-alba-b-candidates
          path: hardware/pcb/targeted-alba/              # Print full DRC report for coordinate/object diagnosis; only four small candidates.
              if critical:
                  print("REPORT_BEGIN",p.name)
                  print(t)
                  print("REPORT_END",p.name)
          PY
      - name: DRC all candidates
        run: |
          set -u
          for pcb in hardware/pcb/targeted-alba/*.kicad_pcb; do
            n="${pcb%.kicad_pcb}"
            kicad-cli pcb drc --severity-error --output "${n}.drc.txt" "$pcb" || true
          done
      - name: Rank candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in sorted(Path("hardware/pcb/targeted-alba").glob("*.drc.txt")):
              t=p.read_text()
              m=re.search(r'Found +([0-9]+) +unconnected +(items|pads)',t,re.I)
              u=int(m.group(1)) if m else t.count('[unconnected_items]')
              cats=[x[1:x.index(']')] for x in t.splitlines() if x.startswith('[') and ']' in x]
              critical=sorted({x for x in cats if x not in {'unconnected_items','lib_footprint_mismatch'}})
              print(p.name,"unconnected=",u,"critical=",critical or "none")
              if critical:
                  lines=t.splitlines()
                  for i,line in enumerate(lines):
                      if line.startswith('[') and line[1:line.index(']')] in critical:
                          print("DETAIL",p.name,*lines[i:i+5],sep=" | ")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: targeted-alba-b-candidates
          path: hardware/pcb/targeted-alba/
