name: PCB Targeted ALBA_B Route
'on':
  push:
    branches: [dev]
    paths:
      - ".github/workflows/pcb-targeted-alba-b.yml"
      - "hardware/pcb/tools/grid_router.py"
permissions:
  contents: read
jobs:
  route:
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:9.0
      options: --user 0
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify KiCad CLI
        run: kicad-cli version
      - name: Build ALBA clearance-fix candidates
        run: |
          set -eu
          mkdir -p hardware/pcb/targeted-alba
          python3 - <<'PY'
          from pathlib import Path
          src=Path("hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb").read_text()
          old=[
            '(segment (start 127.5 170.5) (end 127.5 172.75) (width 0.4) (layer "F.Cu") (net 61))',
            '(via (at 127.5 172.75) (size 0.8) (drill 0.4) (layers "F.Cu" "B.Cu") (net 61))',
            '(segment (start 127.5 172.75) (end 129.5 172.75) (width 0.4) (layer "B.Cu") (net 61))']
          variants={
            "fix_128_173":(128.0,173.0),
            "fix_1285_173":(128.5,173.0),
            "fix_128_1735":(128.0,173.5),
            "fix_1285_1735":(128.5,173.5),
            "fix_129_173":(129.0,173.0)}
          for name,(x,y) in variants.items():
            s=src
            new=[
              f'(segment (start 127.5 170.5) (end {x} {y}) (width 0.4) (layer "F.Cu") (net 61))',
              f'(via (at {x} {y}) (size 0.8) (drill 0.4) (layers "F.Cu" "B.Cu") (net 61))',
              f'(segment (start {x} {y}) (end 129.5 172.75) (width 0.4) (layer "B.Cu") (net 61))']
            for a,b in zip(old,new):
              assert a in s,a
              s=s.replace(a,b,1)
            Path(f"hardware/pcb/targeted-alba/{name}.kicad_pcb").write_text(s)
          PY
      - name: DRC all candidates
        run: |
          set -u
          for pcb in hardware/pcb/targeted-alba/*.kicad_pcb; do
            n="${pcb%.kicad_pcb}"
            kicad-cli pcb drc --severity-error --output "${n}.drc.txt" "$pcb" || true
          done
      - name: Rank candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in sorted(Path("hardware/pcb/targeted-alba").glob("*.drc.txt")):
              t=p.read_text()
              m=re.search(r'Found +([0-9]+) +unconnected +(items|pads)',t,re.I)
              u=int(m.group(1)) if m else t.count('[unconnected_items]')
              cats=[x[1:x.index(']')] for x in t.splitlines() if x.startswith('[') and ']' in x]
              critical=sorted({x for x in cats if x not in {'unconnected_items','lib_footprint_mismatch'}})
              print(p.name,"unconnected=",u,"critical=",critical or "none")
              if critical:
                  lines=t.splitlines()
                  for i,line in enumerate(lines):
                      if line.startswith('[') and line[1:line.index(']')] in critical:
                          print("DETAIL",p.name,*lines[i:i+5],sep=" | ")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: targeted-alba-b-candidates
          path: hardware/pcb/targeted-alba/










