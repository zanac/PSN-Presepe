name: Promote Validated ALBA Route
on:
  push:
    branches: [dev]
    paths: [".github/workflows/promote-validated-autoroute.yml"]
permissions:
  contents: write
  actions: read
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Download exact validated ALBA artifact
        uses: actions/download-artifact@v4
        with:
          name: targeted-alba-b-candidates
          repository: zanac/PSN-Presepe
          run-id: 36917747409
          github-token: ${{ github.token }}
          path: /tmp/alba
      - name: Verify and promote exact DRC-clean board
        run: |
          set -euo pipefail
          test "$(sha256sum /tmp/alba/astar.kicad_pcb | awk '{print $1}')" = "375180931d81941c8e779a37e8520d5c06d50b37f63b85b9791f4d072a31f89b"
          grep -q "Found 117 unconnected pads" /tmp/alba/astar.drc.txt
          ! grep -Eq '^\\[(clearance|shorting_items|tracks_crossing|track_dangling|via_dangling|hole_clearance|copper_edge_clearance|solder_mask_bridge)\\]' /tmp/alba/astar.drc.txt
          cp /tmp/alba/astar.kicad_pcb hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb
          git commit -m "Promote DRC-clean ALBA_B route"
          git push origin HEAD:dev
