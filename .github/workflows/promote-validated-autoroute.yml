name: Promote Validated Autoroute
on:
  push:
    branches: [dev]
    paths: [".github/workflows/promote-validated-autoroute.yml"]
permissions:
  contents: write
  actions: read
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Download validated artifact
        uses: actions/download-artifact@v4
        with:
          name: PSN-Presepe-RevA-Autoroute-Candidate
          repository: zanac/PSN-Presepe
          run-id: 36901223170
          github-token: ${{ github.token }}
          path: /tmp/autoroute
      - name: Verify and promote exact validated board
        run: |
          set -euo pipefail
          test "$(sha256sum /tmp/autoroute/PSN-Presepe-Mega-routed.kicad_pcb | awk '{print $1}')" = "6fceb6eb04f7106b439376a042ee5e727971977724bb0802adda80ba4260174d"
          grep -q "Found 118 unconnected pads" /tmp/autoroute/drc-routed.txt
          cp /tmp/autoroute/PSN-Presepe-Mega-routed.kicad_pcb hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb
          git commit -m "Promote validated three-net autoroute delta"
          git push origin HEAD:dev
