name: PCB KiCad Validation

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - "hardware/pcb/**"
      - ".github/workflows/pcb-kicad.yml"

permissions:
  contents: read

concurrency:
  group: pcb-kicad-dev
  cancel-in-progress: true

jobs:
  validate-pcb:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - name: Verify KiCad 10
        run: kicad-cli --version
      - name: Load PCB with KiCad geometry engine
        run: |
          python3 - <<'PY'
          import pcbnew
          p="hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb"
          b=pcbnew.LoadBoard(p)
          print("PCB_LOAD_PASS footprints=",len(list(b.GetFootprints())),"tracks=",len(list(b.GetTracks())))
          if not list(b.GetFootprints()): raise SystemExit(1)
          PY
      - name: Verify production mechanical gates
        run: |
          python3 hardware/pcb/tools/check_mega_stackable.py
          python3 hardware/pcb/tools/check_mega_pinmap.py
          python3 hardware/pcb/tools/check_mega_mechanical_bom.py
          python3 hardware/pcb/tools/check_terminal_silkscreen.py
      - name: Export Rev-B component pin/net map
        run: |
          mkdir -p hardware/pcb/build
          python3 hardware/pcb/tools/export_revb_pin_net_map.py \
            hardware/pcb/release/Rev-B/PSN-Presepe-Mega-FREEROUTED.kicad_pcb \
            > hardware/pcb/build/revb-pin-net-map.tsv
          head -20 hardware/pcb/build/revb-pin-net-map.tsv
      - name: Probe native headless Eeschema conversion API
        run: |
          {
            python3 - <<'PY'
          try:
              import _eeschema
              print("EESCHEMA_PYBIND_AVAILABLE", _eeschema)
              print("SCH_IO_MGR", hasattr(_eeschema, "SCH_IO_Mgr"))
          except Exception as e:
              print("EESCHEMA_PYBIND_UNAVAILABLE", repr(e))
          PY
            command -v eeschema || true
            eeschema --version || true
            eeschema --help || true
          } 2>&1 | tee hardware/pcb/build/eeschema-probe.txt
      - name: Probe maintained schematic-generation libraries
        continue-on-error: true
        run: |
          set +e
          python3 -m pip install kicad-sch-api kiutils >hardware/pcb/build/schematic-libs-probe.log 2>&1
          echo "PIP_RC=$?" >> hardware/pcb/build/schematic-libs-probe.log
          python3 - <<'PY' >> hardware/pcb/build/schematic-libs-probe.log 2>&1
          import importlib
          for name in ("kicad_sch_api","kiutils"):
              try:
                  m=importlib.import_module(name)
                  print(name,"IMPORT_PASS",getattr(m,"__version__","unknown"))
              except Exception as e:
                  print(name,"IMPORT_FAIL",repr(e))
          PY
          cat hardware/pcb/build/schematic-libs-probe.log
          exit 0
      - name: Generate real-symbol legacy Rev-B schematic
        run: |
          python3 hardware/pcb/tools/generate_revb_legacy_schematic.py \
            hardware/pcb/release/Rev-B/PSN-Presepe-Mega-FREEROUTED.kicad_pcb \
            hardware/pcb/build/PSN-Presepe-Mega-RevB.sch
          test -s hardware/pcb/build/PSN-Presepe-Mega-RevB.sch
          test -s hardware/pcb/build/PSN-Presepe-Mega-RevB-cache.lib
          # KiCad 10 must be able to parse the real-symbol legacy schematic.
          # Probe KiCad 10 schematic conversion/export capabilities first.
          kicad-cli sch --help | tee hardware/pcb/build/kicad-sch-help.txt
          kicad-cli create-project --help 2>&1 | tee hardware/pcb/build/kicad-create-project-help.txt || true
          # Legacy source and cache must both be non-empty; conversion to modern
          # format is the next hard gate before ERC.
      - name: Validate KiCad 10 real-schematic fixture
        run: |
          python3 hardware/pcb/tools/generate_kicad10_schematic_fixture.py hardware/pcb/build/kicad10-fixture.kicad_sch
          kicad-cli sch export netlist --output hardware/pcb/build/kicad10-fixture.net hardware/pcb/build/kicad10-fixture.kicad_sch
          test -s hardware/pcb/build/kicad10-fixture.net
          grep -q 'NET_A' hardware/pcb/build/kicad10-fixture.net
          grep -q 'NET_B' hardware/pcb/build/kicad10-fixture.net
          grep -q 'J1' hardware/pcb/build/kicad10-fixture.net
      - name: Generate Rev-B schematic from validated PCB netlist
        run: |
          python3 hardware/pcb/tools/generate_revb_schematic.py \
            hardware/pcb/release/Rev-B/PSN-Presepe-Mega-FREEROUTED.kicad_pcb \
            hardware/pcb/kicad/PSN-Presepe-Mega-RevB.kicad_sch
          test -s hardware/pcb/kicad/PSN-Presepe-Mega-RevB.kicad_sch
      - name: Export real Rev-B schematic netlist
        run: |
          set +e
          kicad-cli sch export netlist --output hardware/pcb/build/revb-real.net \
            hardware/pcb/kicad/PSN-Presepe-Mega-RevB.kicad_sch \
            >hardware/pcb/build/revb-netlist-export.log 2>&1
          rc=$?
          set -e
          cat hardware/pcb/build/revb-netlist-export.log
          test $rc -eq 0
          test -s hardware/pcb/build/revb-real.net
          echo "=== NETLIST SAMPLE ==="
          head -80 hardware/pcb/build/revb-real.net
          echo "=== KEY TOKENS ==="
          grep -n -E 'MCU1|CIELO_R_NEG|R16_NO' hardware/pcb/build/revb-real.net || true
          python3 - <<'PY'
          p="hardware/pcb/build/revb-real.net"
          s=open(p,encoding="utf-8",errors="replace").read()
          print("NETLIST_BYTES",len(s))
          for k in ("MCU1","CIELO_R_NEG","R16_NO"):
              print("TOKEN",k,"COUNT",s.count(k))
          if not all(k in s for k in ("MCU1","CIELO_R_NEG","R16_NO")):
              raise SystemExit("Required Rev-B connectivity tokens missing from KiCad-exported netlist")
          PY
      - name: Reject non-electrical schematic placeholders
        run: |
          python3 - <<'PY'
          import re,csv
          sch="hardware/pcb/kicad/PSN-Presepe-Mega-RevB.kicad_sch"
          mp="hardware/pcb/build/revb-pin-net-map.tsv"
          s=open(sch,encoding="utf-8").read()
          rows=list(csv.DictReader(open(mp,encoding="utf-8"),delimiter="\t"))
          expected_refs={r["ref"] for r in rows if not r["ref"].startswith("H")}
          expected_pins=len([r for r in rows if not r["ref"].startswith("H")])
          libdefs=len(re.findall(r'\\(symbol "PSN:[^"]+"',s))
          instances=len(re.findall(r'\\(symbol\\s+\\(lib_id "PSN:[^"]+"\\)',s))
          pin_instances=len(re.findall(r'\\(pin "[^"]+" \\(uuid "[^"]+"\\)\\)',s))
          labels=len(re.findall(r'\\(global_label "[^"]+"',s))
          missing_refs=sorted(r for r in expected_refs if f'(reference "{r}")' not in s)
          diag=("REAL_SCHEMATIC_GATE expected_refs=%d expected_pins=%d libdefs=%d instances=%d pin_instances=%d labels=%d" %
                (len(expected_refs),expected_pins,libdefs,instances,pin_instances,labels))
          print(diag)
          open("hardware/pcb/build/revb-real-gate.log","w").write(diag+"\\n")
          if not expected_refs or expected_pins < 1:
              raise SystemExit("PCB connectivity map unexpectedly empty")
          if missing_refs:
              print("MISSING_REFS",missing_refs)
              raise SystemExit("Connected PCB references missing from schematic instances")
          if libdefs != len(expected_refs) or instances != len(expected_refs):
              raise SystemExit("Schematic component count does not match connected PCB references")
          if pin_instances != expected_pins or labels != expected_pins:
              raise SystemExit("Schematic pin/label count does not match connected PCB pads")
          net=open("hardware/pcb/build/revb-real.net",encoding="utf-8",errors="replace").read()
          if len(net) < 1000:
              raise SystemExit("KiCad-exported electrical netlist unexpectedly small")
          PY
      - name: Rev-B schematic ERC
        run: |
          mkdir -p hardware/pcb/build
          kicad-cli sch erc --severity-all --output hardware/pcb/build/revb-erc.txt hardware/pcb/kicad/PSN-Presepe-Mega-RevB.kicad_sch
          echo ERC_PASS
      - name: Validate Rev-B release PCB with KiCad 10
        run: |
          mkdir -p hardware/pcb/build
          test -s hardware/pcb/release/Rev-B/PSN-Presepe-Mega-FREEROUTED.kicad_pcb
          cp hardware/pcb/release/Rev-B/PSN-Presepe-Mega-FREEROUTED.kicad_dru hardware/pcb/release/Rev-B/PSN-Presepe-Mega-FREEROUTED.kicad_dru.check
          kicad-cli pcb drc --severity-all --output hardware/pcb/build/revb-drc.txt hardware/pcb/release/Rev-B/PSN-Presepe-Mega-FREEROUTED.kicad_pcb || true
          grep -q "Found 0 unconnected pads" hardware/pcb/build/revb-drc.txt
          if grep -qE '^\\[(clearance|shorting_items|unconnected_items)\\]' hardware/pcb/build/revb-drc.txt; then cat hardware/pcb/build/revb-drc.txt; exit 1; fi
          echo REV_B_VALIDATION_PASS
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PCB-RevB-validation-report
          path: |
            hardware/pcb/build/revb-drc.txt
            hardware/pcb/build/revb-erc.txt
            hardware/pcb/build/revb-pin-net-map.tsv
            hardware/pcb/build/kicad-sch-help.txt
            hardware/pcb/build/eeschema-probe.txt
            hardware/pcb/build/kicad10-fixture.kicad_sch
            hardware/pcb/build/kicad10-fixture.net
            hardware/pcb/build/revb-real.net
            hardware/pcb/build/revb-netlist-export.log
            hardware/pcb/build/revb-real-gate.log
            hardware/pcb/build/schematic-libs-probe.log
            hardware/pcb/build/kicad-create-project-help.txt
            hardware/pcb/build/PSN-Presepe-Mega-RevB.sch
            hardware/pcb/build/PSN-Presepe-Mega-RevB-cache.lib
            hardware/pcb/kicad/PSN-Presepe-Mega-RevB.kicad_sch
          if-no-files-found: warn
