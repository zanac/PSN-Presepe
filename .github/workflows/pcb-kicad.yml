name: PCB KiCad Validation

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - "hardware/pcb/**"
      - ".github/workflows/pcb-kicad.yml"

permissions:
  contents: read

concurrency:
  group: pcb-kicad-dev
  cancel-in-progress: true

jobs:
  validate-pcb:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - name: Verify KiCad 10
        run: kicad-cli --version
      - name: Load PCB with KiCad geometry engine
        run: |
          python3 - <<'PY'
          import pcbnew
          p="hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb"
          b=pcbnew.LoadBoard(p)
          print("PCB_LOAD_PASS footprints=",len(list(b.GetFootprints())),"tracks=",len(list(b.GetTracks())))
          if not list(b.GetFootprints()): raise SystemExit(1)
          PY
      - name: Verify production mechanical gates
        run: |
          python3 hardware/pcb/tools/check_mega_stackable.py
          python3 hardware/pcb/tools/check_mega_pinmap.py
          python3 hardware/pcb/tools/check_mega_mechanical_bom.py
          python3 hardware/pcb/tools/check_terminal_silkscreen.py
      - name: Export Rev-B component pin/net map
        run: |
          mkdir -p hardware/pcb/build
          python3 hardware/pcb/tools/export_revb_pin_net_map.py \
            hardware/pcb/release/Rev-B/PSN-Presepe-Mega-FREEROUTED.kicad_pcb \
            > hardware/pcb/build/revb-pin-net-map.tsv
          head -20 hardware/pcb/build/revb-pin-net-map.tsv
      - name: Generate Rev-B schematic from validated PCB netlist
        run: |
          python3 hardware/pcb/tools/generate_revb_schematic.py \
            hardware/pcb/release/Rev-B/PSN-Presepe-Mega-FREEROUTED.kicad_pcb \
            hardware/pcb/kicad/PSN-Presepe-Mega-RevB.kicad_sch
          test -s hardware/pcb/kicad/PSN-Presepe-Mega-RevB.kicad_sch
      - name: Verify Rev-B schematic connectivity matches PCB
        run: |
          python3 hardware/pcb/tools/check_revb_schematic_connectivity.py \
            hardware/pcb/release/Rev-B/PSN-Presepe-Mega-FREEROUTED.kicad_pcb \
            hardware/pcb/kicad/PSN-Presepe-Mega-RevB.kicad_sch
      - name: Reject non-electrical schematic placeholders
        run: |
          SCH=hardware/pcb/kicad/PSN-Presepe-Mega-RevB.kicad_sch
          # A real modern KiCad schematic must embed symbol definitions and
          # instantiate electrical symbols/pins; text-only net inventories fail.
          python3 - <<'PY'
          import re
          p="hardware/pcb/kicad/PSN-Presepe-Mega-RevB.kicad_sch"
          s=open(p,encoding="utf-8").read()
          libdefs=len(re.findall(r'\\(symbol "[^"]+"', s[s.find("(lib_symbols)"):])) if "(lib_symbols)" in s else 0
          instances=len(re.findall(r'^  \\(symbol\\s',s,re.M))
          pins=len(re.findall(r'\\(pin "[^"]+" \\(uuid ',s))
          print("REAL_SCHEMATIC_GATE", "libdefs=",libdefs, "instances=",instances, "pins=",pins)
          if libdefs < 1 or instances < 1 or pins < 1:
              raise SystemExit("Text-only/placeholder schematic rejected: real symbols and pins required")
          PY
      - name: Rev-B schematic ERC
        run: |
          mkdir -p hardware/pcb/build
          kicad-cli sch erc --severity-all --output hardware/pcb/build/revb-erc.txt hardware/pcb/kicad/PSN-Presepe-Mega-RevB.kicad_sch
          echo ERC_PASS
      - name: Validate Rev-B release PCB with KiCad 10
        run: |
          mkdir -p hardware/pcb/build
          test -s hardware/pcb/release/Rev-B/PSN-Presepe-Mega-FREEROUTED.kicad_pcb
          cp hardware/pcb/release/Rev-B/PSN-Presepe-Mega-FREEROUTED.kicad_dru hardware/pcb/release/Rev-B/PSN-Presepe-Mega-FREEROUTED.kicad_dru.check
          kicad-cli pcb drc --severity-all --output hardware/pcb/build/revb-drc.txt hardware/pcb/release/Rev-B/PSN-Presepe-Mega-FREEROUTED.kicad_pcb || true
          grep -q "Found 0 unconnected pads" hardware/pcb/build/revb-drc.txt
          if grep -qE '^\\[(clearance|shorting_items|unconnected_items)\\]' hardware/pcb/build/revb-drc.txt; then cat hardware/pcb/build/revb-drc.txt; exit 1; fi
          echo REV_B_VALIDATION_PASS
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PCB-RevB-validation-report
          path: |
            hardware/pcb/build/revb-drc.txt
            hardware/pcb/build/revb-erc.txt
            hardware/pcb/build/revb-pin-net-map.tsv
            hardware/pcb/kicad/PSN-Presepe-Mega-RevB.kicad_sch
          if-no-files-found: warn
