name: PCB Large 2x Autoroute

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - hardware/pcb/tools/make_large_2x.py
      - hardware/pcb/tools/autoroute_large_2x.py
      - .github/workflows/pcb-large-2x.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad
      - name: Build 2x board
        run: python3 hardware/pcb/tools/make_large_2x.py
      - name: Autoroute pair nets
        run: python3 hardware/pcb/tools/autoroute_large_2x.py
      - name: DRC routed large board
        run: |
          kicad-cli pcb drc --severity-all --output hardware/pcb/kicad/PSN-Presepe-Mega-LARGE-2X.drc.txt hardware/pcb/kicad/PSN-Presepe-Mega-LARGE-2X.kicad_pcb || true
          grep -E 'Found|\\[.*\\]:' hardware/pcb/kicad/PSN-Presepe-Mega-LARGE-2X.drc.txt | tail -80 || true
          echo "DRC_CATEGORY_COUNTS"
          grep -oE '\\[[a-z_]+\\]' hardware/pcb/kicad/PSN-Presepe-Mega-LARGE-2X.drc.txt | sort | uniq -c | sort -nr || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path("hardware/pcb/kicad/PSN-Presepe-Mega-LARGE-2X.drc.txt")
          s=p.read_text()
          cats=sorted(set(re.findall(r'\\[([a-z_]+)\\]',s)))
          forbidden={"clearance","shorting_items","tracks_crossing","hole_clearance","solder_mask_bridge"}
          critical=sorted(forbidden & set(cats))
          m=re.search(r"Found (\\d+) unconnected",s)
          print("LARGE_DRC_GATE unconnected=",m.group(1) if m else "?","critical=",critical or "none")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pcb-large-2x
          path: |
            hardware/pcb/kicad/PSN-Presepe-Mega-LARGE-2X.kicad_pcb
            hardware/pcb/kicad/PSN-Presepe-Mega-LARGE-2X.drc.txt
