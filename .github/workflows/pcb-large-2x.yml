name: PCB Large 2x Autoroute

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - hardware/pcb/tools/make_large_2x.py
      - hardware/pcb/tools/autoroute_large_2x.py
      - hardware/pcb/tools/grid_router.py
      - hardware/pcb/tools/reroute_d32_group.py
      - hardware/pcb/tools/reroute_d26_group.py
      - .github/workflows/pcb-large-2x.yml

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Verify KiCad container
        run: kicad-cli --version
      - name: Build 2x board
        run: python3 hardware/pcb/tools/make_large_2x.py
      - name: Autoroute pair nets
        run: python3 hardware/pcb/tools/autoroute_large_2x.py
      - name: Local reroute D32 blocker group
        run: python3 hardware/pcb/tools/reroute_d32_group.py
      - name: Local reroute D26 blocker group
        run: python3 hardware/pcb/tools/reroute_d26_group.py
      - name: Diagnose D26 local blockers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,math,subprocess
          p=Path("hardware/pcb/kicad/PSN-Presepe-Mega-LARGE-2X.kicad_pcb")
          s=p.read_text()
          # Coordinates on LARGE are deterministic: footprint origins are doubled
          # from (20,20), while pad-local offsets stay unchanged.
          # U1 pad2: original (135,64.54) -> LARGE footprint origin (250,104), pad => (250,106.54)
          # Arduino D26 pad coordinate is obtained by the same generated-board parser in autoroute.
          exec(open("hardware/pcb/tools/autoroute_large_2x.py").read().split('print("PAIR_NETS"')[0])
          ps=[z[2] for z in pairs if z[1]=="D26_RELAY2"][0]
          a,b=ps
          cmd=["python3","hardware/pcb/tools/grid_router.py",str(p),"--net","D26_RELAY2",
               "--start",f"{a[0]},{a[1]},B.Cu","--goal",f"{b[0]},{b[1]},B.Cu",
               "--step","0.5","--clearance","0.8","--margin","180","--via-cost","100",
               "--soft-congestion","--congestion-cost","5000","--report-blockers","--blockers-only"]
          subprocess.run(cmd,check=False)
          PY
      - name: Diagnose D32 local blockers
        run: |
          python3 hardware/pcb/tools/grid_router.py hardware/pcb/kicad/PSN-Presepe-Mega-LARGE-2X.kicad_pcb \
            --net D32_RELAY8 --start 129.98,128.44,B.Cu --goal 250,121.78,B.Cu \
            --step 0.5 --clearance 0.8 --margin 180 --via-cost 100 \
            --soft-congestion --congestion-cost 5000 --report-blockers --blockers-only || true
      - name: DRC routed large board
        run: |
          kicad-cli pcb drc --severity-all --output hardware/pcb/kicad/PSN-Presepe-Mega-LARGE-2X.drc.txt hardware/pcb/kicad/PSN-Presepe-Mega-LARGE-2X.kicad_pcb || true
          grep -E 'Found|\\[.*\\]:' hardware/pcb/kicad/PSN-Presepe-Mega-LARGE-2X.drc.txt | tail -80 || true
          echo "DRC_CATEGORY_COUNTS"
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          s=Path("hardware/pcb/kicad/PSN-Presepe-Mega-LARGE-2X.drc.txt").read_text()
          cats=[]
          for line in s.splitlines():
              z=line.strip()
              if z.startswith("[") and "]:" in z:
                  cats.append(z[1:z.index("]:")])
          counts=Counter(cats)
          for k,v in counts.most_common():
              print(v,k)
          forbidden={"clearance","shorting_items","tracks_crossing","hole_clearance","solder_mask_bridge"}
          critical={k:v for k,v in counts.items() if k in forbidden}
          print("LARGE_DRC_GATE critical=",critical or "none")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pcb-large-2x
          path: |
            hardware/pcb/kicad/PSN-Presepe-Mega-LARGE-2X.kicad_pcb
            hardware/pcb/kicad/PSN-Presepe-Mega-LARGE-2X.drc.txt
