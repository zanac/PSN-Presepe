name: PCB Size Sweep

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/pcb-size-sweep.yml"

jobs:
  sweep:
    name: "Scale ${{ matrix.scale }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scale:
          - "0.90"
          - "0.80"
          - "0.70"
          - "0.60"
          - "0.50"
    steps:
      - uses: actions/checkout@v4

      - name: Generate board
        run: python3 hardware/pcb/tools/make_scaled_board.py --scale "${{ matrix.scale }}" --output sweep.kicad_pcb

      - name: Export DSN
        run: |
          docker run --rm --user 0 -v "$PWD:/work" -w /work kicad/kicad:10.0 bash -c 'python3 -c "import pcbnew; b=pcbnew.LoadBoard(\"sweep.kicad_pcb\"); assert pcbnew.ExportSpecctraDSN(b,\"sweep.dsn\")"'

      - name: Freeroute
        run: |
          docker run --rm --user 0 -v "$PWD:/work" -w /work ghcr.io/freerouting/freerouting:2.2.4 java -jar /app/freerouting-executable.jar --gui.enabled=false -de /work/sweep.dsn -do /work/routed.ses -mp 100
          test -s routed.ses

      - name: Import SES
        run: |
          docker run --rm --user 0 -v "$PWD:/work" -w /work kicad/kicad:10.0 bash -c 'python3 -c "import pcbnew; b=pcbnew.LoadBoard(\"sweep.kicad_pcb\"); assert pcbnew.ImportSpecctraSES(b,\"routed.ses\"); pcbnew.SaveBoard(\"sweep-routed.kicad_pcb\",b)"'

      - name: DRC
        run: |
          docker run --rm --user 0 -v "$PWD:/work" -w /work kicad/kicad:10.0 kicad-cli pcb drc --severity-all --output sweep.drc.txt sweep-routed.kicad_pcb || true
          grep -E 'Found|\\[.*\\]:' sweep.drc.txt | tail -100 || true

      - uses: actions/upload-artifact@v4
        with:
          name: "pcb-sweep-${{ matrix.scale }}"
          path: |
            sweep-routed.kicad_pcb
            sweep.drc.txt
