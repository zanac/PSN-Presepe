name: PCB Original KiCad10 Freerouting
# 280x170 production routing pipeline
# trigger: newline-repair-verified

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/pcb-freerouting-k10.yml'
      - 'hardware/pcb/kicad/PSN-Presepe-Mega.kicad_dru'
      - 'hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb'
      - 'hardware/pcb/tools/make_clean_board.py'
      - 'hardware/pcb/tools/check_mega_stackable.py'
      - 'hardware/pcb/tools/check_terminal_silkscreen.py'
      - 'hardware/pcb/ASSEMBLY.md'

jobs:
  export-dsn:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - name: Verify KiCad 10
        run: kicad-cli --version
      - name: Verify Mega stackable expansion envelope
        run: python3 hardware/pcb/tools/check_mega_stackable.py

      - name: Verify terminal silkscreen labels
        run: python3 hardware/pcb/tools/check_terminal_silkscreen.py

      - name: Prepare clean original 280x170 PCB and export Specctra DSN
        run: |
          python3 hardware/pcb/tools/make_clean_board.py --output hardware/pcb/kicad/PSN-Presepe-Mega-CLEAN.kicad_pcb
          python3 - <<'PY'
          import pcbnew
          src="hardware/pcb/kicad/PSN-Presepe-Mega-CLEAN.kicad_pcb"
          out="hardware/pcb/kicad/PSN-Presepe-Mega.dsn"
          b=pcbnew.LoadBoard(src)
          ok=pcbnew.ExportSpecctraDSN(b,out)
          print("EXPORT_DSN",ok,out)
          print("DSN_RELAY_RULE_LINES")
          for line in open(out,errors="ignore"):
              if "R1_COM" in line or "clearance" in line.lower(): print(line.rstrip())
          if not ok: raise SystemExit(1)
          PY
      - name: DRC baseline under KiCad 10
        run: |
          kicad-cli pcb drc --severity-all --output hardware/pcb/kicad/baseline-k10.drc.txt hardware/pcb/kicad/PSN-Presepe-Mega-CLEAN.kicad_pcb || true
          grep -E 'Found|\\[.*\\]:' hardware/pcb/kicad/baseline-k10.drc.txt | tail -80 || true
      - uses: actions/upload-artifact@v4
        with:
          name: freerouting-input
          path: |
            hardware/pcb/kicad/PSN-Presepe-Mega-CLEAN.kicad_pcb
            hardware/pcb/kicad/PSN-Presepe-Mega.dsn
            hardware/pcb/kicad/baseline-k10.drc.txt
            hardware/pcb/kicad/PSN-Presepe-Mega.kicad_dru

  freeroute:
    needs: export-dsn
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/freerouting/freerouting:2.2.4
      options: --user 0
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: freerouting-input
          path: work
      - name: Freerouting 2.2.4 headless
        run: |
          find work -type f -maxdepth 6 -print
          DSN=$(find work -name '*.dsn' | head -1)
          echo "DSN=$DSN"
          java -jar /app/freerouting-executable.jar --gui.enabled=false -de "$DSN" -do work/routed.ses -mp 100
          test -s work/routed.ses
      - uses: actions/upload-artifact@v4
        with:
          name: freerouting-output
          path: work/routed.ses

  import-and-drc:
    needs: [export-dsn, freeroute]
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user 0
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: freerouting-input
          path: input
      - uses: actions/download-artifact@v4
        with:
          name: freerouting-output
          path: output
      - name: Import SES, apply 6mm rule and run final DRC
        run: |
          python3 - <<'PY'
          import pcbnew, glob, shutil
          src=glob.glob("input/**/*.kicad_pcb",recursive=True)[0]
          ses=glob.glob("output/**/*.ses",recursive=True)[0]
          dru=glob.glob("input/**/*.kicad_dru",recursive=True)[0]
          out="PSN-Presepe-Mega-FREEROUTED.kicad_pcb"
          print("CUSTOM_RULE_SOURCE",dru)
          print("CUSTOM_RULE_6MM_PRESENT","min 6mm" in open(dru).read())
          b=pcbnew.LoadBoard(src)
          ok=pcbnew.ImportSpecctraSES(b,ses)
          print("IMPORT_SES",ok,ses)
          if not ok: raise SystemExit(1)
          pcbnew.SaveBoard(out,b)
          shutil.copyfile(dru,"PSN-Presepe-Mega-FREEROUTED.kicad_dru")
          PY
          test -f PSN-Presepe-Mega-FREEROUTED.kicad_dru
          grep -n "Relay contacts to SELV 6mm\|min 6mm" PSN-Presepe-Mega-FREEROUTED.kicad_dru
          cp PSN-Presepe-Mega-FREEROUTED.kicad_pcb positive-control.kicad_pcb
          cat > positive-control.kicad_dru <<'EOF'
          (version 1)
          (rule "CI positive control 100mm"
            (condition "A.Type == 'Track' && B.Type == 'Track' && A.Net != B.Net")
            (constraint clearance (min 100mm))
          )
          EOF
          kicad-cli pcb drc --severity-all --output positive-control.drc.txt positive-control.kicad_pcb || true
          kicad-cli pcb drc --severity-all --output freerouted-k10.drc.txt PSN-Presepe-Mega-FREEROUTED.kicad_pcb || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          def violations(path):
              s=Path(path).read_text()
              m=re.search(r"Found ([0-9]+) DRC violations",s,re.I)
              return int(m.group(1)) if m else -1
          base=violations("freerouted-k10.drc.txt")
          control=violations("positive-control.drc.txt")
          print("CUSTOM_RULE_POSITIVE_CONTROL baseline=",base,"forced=",control)
          if base < 0 or control <= base:
              raise SystemExit("CUSTOM_RULE_POSITIVE_CONTROL failed")
          print("CUSTOM_RULE_POSITIVE_CONTROL passed")
          PY
          grep -E 'Found|\\[.*\\]:' freerouted-k10.drc.txt | tail -160 || true
          echo '--- FULL UNEXPECTED DRC DETAILS ---'
          cat freerouted-k10.drc.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("freerouted-k10.drc.txt").read_text()
          m=re.findall(r"Found ([0-9]+) unconnected",s,re.I)
          n=int(m[-1]) if m else -1
          cats=[line[1:line.index("]")] for line in s.splitlines() if line.startswith("[") and "]" in line]
          allowed={"lib_footprint_issues"}
          bad=sorted(set(cats)-allowed)
          print("FINAL_GATE unconnected=",n,"categories=",sorted(set(cats)),"unexpected=",bad or "none")
          if n != 0 or bad:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pcb-freerouted-k10
          path: |
            PSN-Presepe-Mega-FREEROUTED.kicad_pcb
            freerouted-k10.drc.txt
