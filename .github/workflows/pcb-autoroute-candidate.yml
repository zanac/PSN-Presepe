name: PCB Autoroute Candidate

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: [".github/workflows/pcb-autoroute-candidate.yml"]

permissions:
  contents: write

env:
  KICAD9_FOOTPRINT_DIR: /usr/share/kicad/footprints

jobs:
  autoroute:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad 9
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints curl

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Export Specctra DSN
        run: |
          mkdir -p hardware/pcb/route-candidate
          python3 - <<'PY'
          import sys
          sys.path.append('/usr/lib/python3/dist-packages')
          import pcbnew
          src='hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb'
          out='hardware/pcb/route-candidate/PSN-Presepe-Mega.dsn'
          b=pcbnew.LoadBoard(src)
          assert b is not None
          assert pcbnew.ExportSpecctraDSN(b,out)
          PY
          sed -i 's/(class RELAY_CONTACT,Default /(class RELAY_CONTACT /; s/(class SELV_POWER,Default /(class SELV_POWER /' hardware/pcb/route-candidate/PSN-Presepe-Mega.dsn

      - name: Download Freerouting 2.2.4
        run: |
          python3 - <<'PY'
          import json, urllib.request
          api='https://api.github.com/repos/freerouting/freerouting/releases/tags/v2.2.4'
          req=urllib.request.Request(api,headers={'User-Agent':'PSN-Presepe-CI'})
          data=json.load(urllib.request.urlopen(req))
          assets=[a for a in data['assets'] if a['name'].endswith('.jar') and 'sources' not in a['name'] and 'javadoc' not in a['name']]
          assert assets
          urllib.request.urlretrieve(assets[0]['browser_download_url'],'hardware/pcb/route-candidate/freerouting.jar')
          PY

      - name: Autoroute raw candidate
        run: |
          java -jar hardware/pcb/route-candidate/freerouting.jar \
            --gui.enabled=false -da -dct 0 -mp 300 \
            -de hardware/pcb/route-candidate/PSN-Presepe-Mega.dsn \
            -do hardware/pcb/route-candidate/PSN-Presepe-Mega.ses

      - name: Import and strip protected routing
        run: |
          cp hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb hardware/pcb/route-candidate/PSN-Presepe-Mega-routed.kicad_pcb
          cp hardware/pcb/kicad/fp-lib-table hardware/pcb/route-candidate/fp-lib-table
          cp -a hardware/pcb/kicad/PSN_Presep_Custom.pretty hardware/pcb/route-candidate/
          python3 - <<'PY'
          import re, sys
          sys.path.append('/usr/lib/python3/dist-packages')
          import pcbnew
          boardfile='hardware/pcb/route-candidate/PSN-Presepe-Mega-routed.kicad_pcb'
          ses='hardware/pcb/route-candidate/PSN-Presepe-Mega.ses'
          b=pcbnew.LoadBoard(boardfile)
          assert b is not None
          assert pcbnew.ImportSpecctraSES(b,ses)
          protected=re.compile(r'^R[0-9]+_(COM|NO|NC)$')
          power={'+12V','GND','+5V_MEGA'}
          removed=0
          for item in list(b.GetTracks()):
              net=item.GetNetname()
              if protected.fullmatch(net) or net in power:
                  b.Remove(item)
                  removed+=1
          print('Removed protected/power routing items:',removed)
          assert pcbnew.SaveBoard(boardfile,b)
          PY

      - name: KiCad DRC on stripped candidate
        continue-on-error: true
        run: |
          kicad-cli pcb drc --severity-all --output hardware/pcb/route-candidate/drc-routed.txt hardware/pcb/route-candidate/PSN-Presepe-Mega-routed.kicad_pcb
          kicad-cli pcb drc --severity-error --output hardware/pcb/route-candidate/drc-errors.txt hardware/pcb/route-candidate/PSN-Presepe-Mega-routed.kicad_pcb

      - name: Candidate statistics
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hardware/pcb/route-candidate/PSN-Presepe-Mega-routed.kicad_pcb')
          if p.exists():
              s=p.read_text()
              print('segments',s.count('(segment'))
              print('vias',s.count('(via'))
          for name in ('drc-routed.txt','drc-errors.txt'):
              r=Path('hardware/pcb/route-candidate')/name
              if r.exists():
                  print(name)
                  for line in r.read_text().splitlines():
                      if 'Found ' in line:
                          print(line)
          PY

      - name: Validate and promote safe logic routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          board=Path('hardware/pcb/route-candidate/PSN-Presepe-Mega-routed.kicad_pcb')
          report=Path('hardware/pcb/route-candidate/drc-errors.txt').read_text()
          assert board.exists()
          text=board.read_text()
          assert text.count('(segment') > 0, 'Candidate has no routed segments'
          assert '** Found 0 DRC violations **' in report, 'Candidate has KiCad DRC errors'
          allowed_power={'+12V','GND','+5V_MEGA'}
          bad=[]
          for line in report.splitlines():
              if not line.lstrip().startswith('@('):
                  continue
              m=re.search(r'\[([^\]]+)\]',line)
              if not m:
                  continue
              net=m.group(1)
              if net in allowed_power or re.fullmatch(r'R[0-9]+_(COM|NO|NC)',net):
                  continue
              bad.append((net,line.strip()))
          assert not bad, f'Unexpected unrouted nets: {bad[:10]}'
          print('Promotion gate OK: only protected/power nets remain unrouted')
          PY
          cp hardware/pcb/route-candidate/PSN-Presepe-Mega-routed.kicad_pcb hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/pcb/kicad/PSN-Presepe-Mega.kicad_pcb
          git commit -m "Promote DRC-gated logic autoroute candidate"
          git push origin HEAD:dev

      - name: Upload autoroute candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PSN-Presepe-RevA-Autoroute-Candidate
          path: hardware/pcb/route-candidate/
